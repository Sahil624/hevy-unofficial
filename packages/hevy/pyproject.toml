[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hevy-unofficial"
version = "0.1.0"
description = "Unofficial Python client for the Hevy workout API (api.hevyapp.com)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "hevy-unofficial contributors" }]
keywords = ["hevy", "fitness", "workout", "api", "client"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-httpx>=0.30",
  "respx>=0.21",
]

[project.urls]
Homepage = "https://github.com/Sahil624/hevy-unofficial"
Repository = "https://github.com/Sahil624/hevy-unofficial"

[tool.hatch.build.targets.wheel]
packages = ["src/hevy_unofficial"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
